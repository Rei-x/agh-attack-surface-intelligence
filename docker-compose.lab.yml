# =============================================================================
# AegisASI — Deterministic University Test Lab + DefectDojo v2 Mock
# Subnet: 172.28.0.0/24 (shared with docker-compose.yml's aegis-asi-net)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
#   # or standalone lab only:
#   docker compose -f docker-compose.lab.yml up -d
# =============================================================================

x-lab-common: &lab-common
  image: aegis-asi-lab:local
  build:
    context: ./lab
    dockerfile: Dockerfile
  restart: unless-stopped
  mem_limit: 32m

services:
  lab-cms:
    <<: *lab-common
    container_name: aegis-lab-cms
    hostname: portal.wi.agh.local
    command: ["python3", "/lab/cms_server.py"]
    networks:
      aegis-net:
        ipv4_address: 172.28.0.10

  lab-admin:
    <<: *lab-common
    container_name: aegis-lab-admin
    hostname: admin.cbi.agh.local
    command: ["python3", "/lab/admin_server.py"]
    networks:
      aegis-net:
        ipv4_address: 172.28.0.11

  lab-staging:
    <<: *lab-common
    container_name: aegis-lab-staging
    hostname: staging.usos.agh.local
    command: ["python3", "/lab/staging_server.py"]
    networks:
      aegis-net:
        ipv4_address: 172.28.0.12

  lab-iot:
    <<: *lab-common
    container_name: aegis-lab-iot
    hostname: printer-c2-114.agh.local
    command: ["python3", "/lab/iot_server.py"]
    networks:
      aegis-net:
        ipv4_address: 172.28.0.13

  lab-flapping:
    <<: *lab-common
    container_name: aegis-lab-flapping
    hostname: moodle.agh.local
    command: ["python3", "/lab/flapping_server.py"]
    ports:
      - "${LAB_FLAPPING_CONTROL_PORT:-19999}:9999"
    networks:
      aegis-net:
        ipv4_address: 172.28.0.14

  lab-defectdojo-mock:
    <<: *lab-common
    container_name: aegis-lab-defectdojo-mock
    hostname: defectdojo.cbi.agh.local
    command: ["python3", "/lab/defectdojo_mock.py"]
    environment:
      DD_PUBLIC_BASE_URL: ${DD_PUBLIC_BASE_URL:-http://localhost:18000}
    ports:
      - "${LAB_DEFECTDOJO_PORT:-18000}:8000"
    networks:
      aegis-net:
        ipv4_address: 172.28.0.20

networks:
  aegis-net:
    name: aegis-asi-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
          gateway: 172.28.0.1

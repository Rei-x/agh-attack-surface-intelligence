services:
  postgres:
    image: postgres:17-alpine
    container_name: dzieciol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dzieciol}
      POSTGRES_USER: ${POSTGRES_USER:-dzieciol}
      # PostgreSQL is not published on the host (internal network only); override for real use.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dzieciol_dev_pass}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dzieciol} -d ${POSTGRES_DB:-dzieciol}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - dzieciol-net

  dzieciol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dzieciol-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DZIECIOL_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dzieciol}:${POSTGRES_PASSWORD:-dzieciol_dev_pass}@postgres:5432/${POSTGRES_DB:-dzieciol}?sslmode=disable
      # No built-in secrets: when DZIECIOL_MASTER_KEY is empty a random 256-bit key is generated on
      # first start and kept in the dzieciol-data volume (/data/master.key) - back it up, without
      # it the encrypted data cannot be read. The JWT signing key is derived from it unless
      # DZIECIOL_JWT_SECRET is set.
      DZIECIOL_MASTER_KEY: ${DZIECIOL_MASTER_KEY:-}
      DZIECIOL_JWT_SECRET: ${DZIECIOL_JWT_SECRET:-}
      # Demo accounts (admin/Admin123! ...) for a lab demo. DZIECIOL_SEED_DEMO=false disables them
      # and creates 'admin' with DZIECIOL_ADMIN_PASSWORD (or a random password shown once in the logs).
      DZIECIOL_SEED_DEMO: ${DZIECIOL_SEED_DEMO:-true}
      DZIECIOL_ADMIN_PASSWORD: ${DZIECIOL_ADMIN_PASSWORD:-}
      DZIECIOL_DATA_DIR: /data
      DZIECIOL_STATIC_DIR: /app/static
      DZIECIOL_LISTEN_ADDR: :8080
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - dzieciol-data:/data
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      # lets the app reach a DefectDojo started by scripts/defectdojo_up.sh on the host (Linux too)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dzieciol-net

volumes:
  pgdata:
  dzieciol-data:

networks:
  dzieciol-net:
    name: dzieciol-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
          gateway: 172.28.0.1

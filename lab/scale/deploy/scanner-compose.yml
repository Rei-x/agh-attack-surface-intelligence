# AegisASI backend for a dedicated Linux scanner host (e.g. Hetzner aegis-scanner).
# The app uses the HOST network namespace so nmap sends real raw SYN/ICMP probes
# from the host's interfaces (no Docker NAT in the path).
#
#   docker compose -f lab/scale/deploy/scanner-compose.yml -p aegis-scanner up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_asi
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_pass}
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_asi"]
      interval: 5s
      timeout: 3s
      retries: 20

  aegis-asi:
    build:
      context: ../../..
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD:-aegis_dev_pass}@127.0.0.1:5432/aegis_asi?sslmode=disable
      ASI_MASTER_KEY: ${ASI_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ASI_JWT_SECRET: ${ASI_JWT_SECRET:-aegis-asi-dev-jwt-secret-replace-in-production}
      ASI_SEED_DEMO: "true"
      ASI_STATIC_DIR: /app/static
      ASI_LISTEN_ADDR: ":8080"
      TZ: Europe/Warsaw
    cap_add:
      - NET_RAW
      - NET_ADMIN

volumes:
  pgdata:
